name: Quality Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

# Per-workflow, per-branch concurrency control
# Cancels older runs of THIS workflow on THIS branch, but allows other workflows/branches to queue
# The single runner will still execute jobs one at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ============================================================
      # Shell Script Validation
      # ============================================================
      # Every script, test and test stub; a scripts/**/*.sh glob misses top-level
      # scripts, since bash runs without globstar
      - name: ShellCheck validation
        run: |
          echo "Running shellcheck on all scripts..."
          mapfile -t files < <(find scripts tests -type f \( -name '*.sh' -o -path 'tests/*/stubs/*' \) | sort)
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable -s bash "${files[@]}"
          echo "✓ All shell scripts passed shellcheck"

      - name: Verify script executability
        run: |
          echo "Checking that all scripts are executable..."
          non_executable=$(find scripts tests -type f \( -name '*.sh' -o -path 'tests/*/stubs/*' \) ! -executable)
          if [ -n "$non_executable" ]; then
            echo "❌ Non-executable scripts found:"
            echo "$non_executable"
            exit 1
          fi
          echo "✓ All shell scripts are executable"

      # ============================================================
      # Docker Configuration Validation
      # ============================================================
      - name: Validate docker-compose.yaml
        run: |
          echo "Validating docker-compose.yaml syntax..."
          docker compose config -q
          echo "✓ docker-compose.yaml is valid"

      # DEBUG_ONLY makes the base entrypoint print the command it would run instead
      # of registering, so this catches an image that would exit on every start
      - name: Verify runner image starts the runner
        run: |
          docker build -t runner-under-test .
          scripts/ci/verify-image.sh runner-under-test

      # The check above must be able to fail: an image that prints nothing, one that
      # prints the marker but exits 1, and one that never exits
      - name: Verify the image check can fail
        run: |
          build() { printf 'FROM runner-under-test\nENTRYPOINT %s\nCMD []\n' "$2" | docker build -q -t "$1" - > /dev/null; }
          build verify-silent '["true"]'
          build verify-exit-1 '["sh", "-c", "echo Running ./bin/Runner.Listener run; exit 1"]'
          build verify-hang '["sleep", "infinity"]'
          for image in verify-silent verify-exit-1 verify-hang; do
            if VERIFY_TIMEOUT=5 scripts/ci/verify-image.sh "$image" > /dev/null; then
              echo "❌ verify-image.sh accepted $image"
              exit 1
            fi
            echo "✓ verify-image.sh rejects $image"
          done
          if [ -n "$(docker ps -aq --filter name=verify-image)" ]; then
            echo "❌ verify-image.sh left a container behind"
            exit 1
          fi

      # Renovate's validator and the documentation tools need Node 24
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'

      - name: Check Dockerfile pins
        run: |
          if ! grep -qE '^FROM [^ ]+@sha256:[0-9a-f]{64}' Dockerfile; then
            echo "❌ The Dockerfile's FROM line has no sha256 digest"
            exit 1
          fi
          if ! grep -qE 'anthropic==[0-9]+(\.[0-9]+)+' Dockerfile; then
            echo "❌ anthropic is not pinned to an exact version"
            exit 1
          fi
          python3 scripts/ci/check-renovate-manager.py
          npx --yes -p renovate@44.148.3 renovate-config-validator --strict

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets in docker-compose.yaml..."
          if grep -E '(password|token|secret|key).*=.*[^$]' docker-compose.yaml | grep -v '${'; then
            echo "❌ Found potentially hardcoded secrets!"
            exit 1
          fi
          echo "✓ No hardcoded secrets found"

      - name: Run script tests
        run: |
          shopt -s nullglob
          tests=(tests/*/*.test.sh)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "❌ No tests found"
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "=== $t"
            bash "$t"
          done

      # The installer and the monitoring scripts each carry read_env_value, since they
      # run standalone; the copies must not drift apart
      - name: Check read_env_value copies match
        run: |
          mapfile -t files < <(git grep -l '^read_env_value() {' -- scripts/)
          if [ "${#files[@]}" -lt 2 ]; then
            echo "❌ Expected at least two copies of read_env_value, found ${#files[@]}"
            exit 1
          fi
          first=''
          for f in "${files[@]}"; do
            body=$(awk '/^read_env_value\(\) \{/ { on = 1 } on { print } on && /^}$/ { exit }' "$f")
            if [ -z "$body" ]; then
              echo "❌ Could not extract read_env_value from $f"
              exit 1
            fi
            if [ -z "$first" ]; then
              first=$body
              first_file=$f
            elif [ "$body" != "$first" ]; then
              echo "❌ read_env_value in $f differs from $first_file:"
              diff <(printf '%s\n' "$first") <(printf '%s\n' "$body") || true
              exit 1
            fi
          done
          echo "✓ ${#files[@]} copies of read_env_value match"

      # Each fixture breaks one rule; the checker must name that rule
      - name: Check publish workflow permissions
        run: |
          python3 -c 'import yaml' || { echo "❌ PyYAML is missing from the runner image"; exit 1; }
          python3 scripts/ci/check-workflow-permissions.py \
            .github/workflows/publish-image.yml .github/workflows/quality.yml
          for fixture in tests/ci/fixtures/*.yml; do
            rule=$(basename "$fixture" .yml)
            rule=${rule%%--*}
            rc=0
            out=$(python3 scripts/ci/check-workflow-permissions.py "$fixture") || rc=$?
            if [ "$rc" != 1 ] || [[ $out != "rule $rule failed"* ]]; then
              echo "❌ $fixture: expected rule $rule to fail, got exit $rc: $out"
              exit 1
            fi
            echo "✓ $fixture fails rule $rule"
          done

      # ============================================================
      # Documentation Validation
      # ============================================================
      - name: Install documentation tools
        run: |
          echo "Installing documentation validation tools..."
          npm install -g markdownlint-cli2@latest
          npm install -g markdown-link-check@latest
          echo "✓ Documentation tools installed"

      - name: Markdown lint
        run: |
          echo "Running markdown linter..."
          markdownlint-cli2 "**/*.md" "#node_modules" "#workspace" "#cache"
          echo "✓ Markdown files passed linting"

      - name: Check internal links
        run: |
          echo "Checking internal documentation links..."
          find . -name "*.md" \
            -not -path "./node_modules/*" \
            -not -path "./workspace/*" \
            -not -path "./cache/*" \
            -not -path "./.git/*" | \
            xargs -I {} markdown-link-check {} --config .github/markdown-link-check.json
          echo "✓ All internal links are valid"

      - name: Spell check
        run: |
          echo "Running spell checker on markdown files..."
          npx cspell "**/*.md" \
            --config .github/cspell.json \
            --no-progress \
            --show-suggestions
          echo "✓ Spell check passed"

      - name: Quality checks summary
        if: success()
        run: |
          echo "================================"
          echo "✅ All quality checks passed!"
          echo "================================"
          echo "  ✓ Shell scripts validated"
          echo "  ✓ Docker compose validated"
          echo "  ✓ Documentation linted"
          echo "  ✓ Links verified"
          echo "  ✓ Spelling checked"
          echo "================================"
